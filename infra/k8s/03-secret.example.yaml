# EJEMPLO — no commitear secrets reales.
# En producción el Secret se crea con kubectl (lo hace deploy.sh), no con este YAML:
#
#   kubectl -n chambapp create secret generic chambapp-secrets \
#     --from-literal=DATABASE_URL="postgresql+psycopg2://chambapp:PASS@127.0.0.1:5432/chambappdb" \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)"
#
# Nota: el host es 127.0.0.1 porque el Cloud SQL Auth Proxy corre como
# sidecar en el mismo pod y expone Postgres en localhost:5432.
apiVersion: v1
kind: Secret
metadata:
  name: chambapp-secrets
  namespace: chambapp
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://chambapp:CHANGEME@127.0.0.1:5432/chambappdb"
  SECRET_KEY: "CHANGEME-genera-uno-con-openssl-rand-hex-32"
