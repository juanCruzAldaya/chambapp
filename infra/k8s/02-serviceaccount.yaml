# ServiceAccount de Kubernetes (KSA) vinculada a una Service Account de Google
# (GSA) vía Workload Identity. Así los pods se autentican ante Cloud SQL SIN
# claves: el Cloud SQL Auth Proxy usa la identidad de esta KSA.
#
# La GSA (${GSA_EMAIL}) debe tener el rol roles/cloudsql.client y estar
# bindeada con: serviceAccount:${PROJECT_ID}.svc.id.goog[chambapp/chambapp]
# (lo hace setup-cluster.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chambapp
  namespace: chambapp
  annotations:
    iam.gke.io/gcp-service-account: ${GSA_EMAIL}
