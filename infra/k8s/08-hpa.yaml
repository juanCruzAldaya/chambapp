# Autoescalado horizontal por uso de CPU. Necesita metrics-server
# (viene activo en GKE). Escala réplicas entre min y max.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chambapp-api
  namespace: chambapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chambapp-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chambapp-web
  namespace: chambapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chambapp-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
